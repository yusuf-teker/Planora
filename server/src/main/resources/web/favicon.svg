<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0B0F19" stroke="url(#glowGrad)" stroke-width="2.5" />
  
  <!-- Ambient Soft Inner Glow -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#glowGrad)" fill-opacity="0.12" />
  
  <!-- HealthTrack & Planora Telemetry Emblem (H with Heart Pulse) -->
  <path d="M19 18V46M45 18V46M19 32H27L30 25L34 39L37 32H45" 
        stroke="url(#glowGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
